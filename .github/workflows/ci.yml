name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV floor)
        run: cargo check --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --all-targets
      - name: cargo test
        run: cargo test --all-targets

  platform-fuzz:
    name: platform fuzz (differential vs pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install the reference module
        # Pinned exactly: reference.mjs reaches into this package's internal
        # lib/*.js by filesystem path, bypassing its `exports` map
        # (TD-S2-04). That layout could move in any release.
        run: npm install --no-save @pnpm/package-is-installable@1000.0.21
        working-directory: tests/fixtures/platform
      - name: cargo test (ignored differential fuzz)
        run: cargo test --test platform_fuzz -- --ignored --nocapture

  vendor-oracle:
    name: vendor oracle (differential vs the npm registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (ignored live-registry oracle)
        run: cargo test --test vendor_oracle -- --ignored --nocapture
      - name: cargo test (ignored buckify scale run)
        run: cargo test --test buckify_scale -- --ignored --nocapture

  buck2-build:
    name: buck2 build (generated output)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install buck2 (pinned release)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o buck2.zst https://github.com/facebook/buck2/releases/download/2026-08-22/buck2-x86_64-unknown-linux-gnu.zst
          zstd -d buck2.zst -o "$HOME/.local/bin/buck2"
          chmod +x "$HOME/.local/bin/buck2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: vendor the prelude at the matching pin
        # buck2 and its prelude are pinned by the SAME release tag, so they
        # cannot drift apart. Spec §1.1 was a design error rather than a
        # prelude regression, but it is exactly the class of breakage an
        # unpinned prelude delivers as a mystery failure.
        run: |
          git clone --depth 1 --branch 2026-08-22 --filter=blob:none --sparse \
            https://github.com/facebook/buck2.git /tmp/buck2src
          git -C /tmp/buck2src sparse-checkout set prelude
          cp -r /tmp/buck2src/prelude tests/fixtures/buck/01-pure-js/prelude
      - name: pudu buckify
        run: cargo run -- -C tests/fixtures/buck/01-pure-js buckify
      - name: buck2 build
        run: buck2 build //third-party/js/...
        working-directory: tests/fixtures/buck/01-pure-js
      - name: the root and bin sub-targets resolve
        run: |
          buck2 build '//third-party/js:@types+node@22.20.0[root]'
          buck2 build '//third-party/js:semver@7.6.3[bin/semver]'
        working-directory: tests/fixtures/buck/01-pure-js
