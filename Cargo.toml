[package]
name          = "pudu"
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.88"
description   = "Translate pnpm-lock.yaml into Buck2 build rules"
authors       = ["Jack Mayo <jackomayo@gmail.com>"]
license       = "MIT"
readme        = "README.md"
repository    = "https://github.com/rsJames-ttrpg/pudu"
homepage      = "https://github.com/rsJames-ttrpg/pudu"
documentation = "https://docs.rs/pudu"
keywords      = ["buck2", "javascript", "pnpm", "lockfile", "build-system"]
categories    = ["development-tools::build-utils", "command-line-utilities"]
exclude       = ["tests/fixtures/**", "docs/**"]

[[bin]]
name = "pudu"
path = "src/main.rs"

[lib]
name = "pudu"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
pathdiff = "0.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
serde_norway = "0.9.42"
sha2 = "0.10"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["yaml"] }
